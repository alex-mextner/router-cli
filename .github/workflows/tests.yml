name: tests

# The suite needs no router and no network: every router page is a synthetic fixture and
# every transport is a fake. It runs on a plain Linux runner.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Lint
        run: uv run --python ${{ matrix.python }} --extra dev ruff check .

      - name: Format check
        run: uv run --python ${{ matrix.python }} --extra dev ruff format --check .

      - name: Type check
        run: uv run --python ${{ matrix.python }} --extra dev mypy router_cli

      - name: Tests
        run: uv run --python ${{ matrix.python }} --extra test pytest -q

      - name: CLI starts on a bare runner
        # Zero runtime deps: help and version must work with nothing installed.
        run: |
          uv run --python ${{ matrix.python }} python -m router_cli.cli --help
          uv run --python ${{ matrix.python }} python -m router_cli.cli --version
